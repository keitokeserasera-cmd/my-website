
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>正負の数 60秒チャレンジ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,"Yu Gothic",sans-serif;
}

body{
  --bg:5;
  --fg:255;

  min-height:100vh;
  overflow:hidden;

  background:rgb(var(--bg),var(--bg),var(--bg));
  color:rgb(var(--fg),var(--fg),var(--fg));

  transition:
    background-color .7s ease,
    color .7s ease;
}

/* =========================
HOME
========================= */

#startScreen{
  position:fixed;
  inset:0;
  z-index:50;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  background:#050505;
  color:white;

  overflow-y:auto;
  padding:45px 0 35px;
}

#startScreen h1{
  margin:0 0 8px;

  font-size:clamp(35px,8vw,75px);
  line-height:1.05;
  font-weight:900;
}

#startScreen p{
  margin:5px;
  opacity:.65;
}

#pressSpace{
  margin-top:20px;
  font-size:20px;
  font-weight:900;

  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.25;}
}

/* =========================
RANK
========================= */

#rankPanel,
#historyPanel{
  width:min(800px,92vw);

  border-radius:22px;

  background:rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.15);

  backdrop-filter:blur(10px);
}

#rankPanel{
  margin-top:24px;
  padding:17px;
}

#rankPanelTitle,
#historyTitle{
  margin-bottom:13px;
  font-size:17px;
  font-weight:900;
}

#rankList{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
}

.rankBadge{
  position:relative;

  min-width:52px;
  padding:8px;

  border-radius:11px;

  background:rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.18);

  text-align:center;
}

.rankName{
  font-size:18px;
  font-weight:900;
}

.rankScore{
  margin-top:2px;
  font-size:9px;
  opacity:.65;
}

.rankBadge.unlocked{
  background:
    linear-gradient(
      135deg,
      #ffb300,
      #ff7200
    );

  color:white;

  border-color:#ffd166;

  box-shadow:
    0 4px 17px
    rgba(255,150,0,.3);
}

.rankBadge.locked{
  opacity:.32;
  filter:grayscale(1);
}

.rankBadge.locked::before{
  content:"🔒";

  position:absolute;
  right:3px;
  top:2px;

  font-size:9px;
}

#rankHint{
  margin-top:11px;
  font-size:11px;
  opacity:.5;
}

/* =========================
TOTAL STATS
========================= */

#historyPanel{
  margin-top:14px;
  padding:16px;
}

#totalStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.totalStat{
  padding:12px 8px;

  border-radius:14px;

  background:
    rgba(255,255,255,.08);

  text-align:center;
}

.totalStat span{
  display:block;

  font-size:11px;
  opacity:.55;

  margin-bottom:4px;
}

.totalStat strong{
  font-size:20px;
  font-weight:900;
}

.green{
  color:#18d66b;
}

.red{
  color:#ff5265;
}

/* =========================
GAME
========================= */

#game{
  width:100%;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  position:relative;
}

#topbar{
  position:absolute;

  top:15px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:center;

  gap:8px;

  z-index:10;
}

.stat{
  padding:8px 12px;

  border-radius:13px;

  background:
    rgba(
      var(--fg),
      var(--fg),
      var(--fg),
      .10
    );

  border:
    1px solid
    rgba(
      var(--fg),
      var(--fg),
      var(--fg),
      .30
    );

  backdrop-filter:blur(8px);

  font-size:14px;
  font-weight:900;

  transition:
    color .7s,
    background .7s,
    border-color .7s;
}

#timer{
  min-width:100px;
  text-align:center;
  font-size:25px;
}

#comboBox{
  color:#ffb300;
}

#combo{
  font-size:20px;
}

#soundBtn{
  cursor:pointer;
  touch-action:manipulation;
}

/* =========================
MAIN
========================= */

#main{
  width:min(850px,92vw);
  text-align:center;
  margin-top:40px;
}

#title{
  font-size:clamp(30px,6vw,62px);
  font-weight:900;
  letter-spacing:2px;

  transition:
    color .7s ease,
    transform .2s ease;
}

#subtitle{
  margin:8px 0 20px;
  opacity:.65;
}

#question{
  min-height:125px;

  display:flex;
  justify-content:center;
  align-items:center;

  margin:5px 0 22px;

  font-size:clamp(38px,8vw,88px);
  font-weight:900;
}

.questionPop{
  animation:questionPop .18s ease;
}

@keyframes questionPop{
  0%{
    transform:scale(.85);
    opacity:.2;
  }

  70%{
    transform:scale(1.05);
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
CHOICES
========================= */

#choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.choice{
  min-height:82px;

  border-radius:20px;

  border:
    2px solid
    rgba(
      var(--fg),
      var(--fg),
      var(--fg),
      .35
    );

  background:
    rgba(
      var(--fg),
      var(--fg),
      var(--fg),
      .10
    );

  color:
    rgb(
      var(--fg),
      var(--fg),
      var(--fg)
    );

  font-size:clamp(23px,4vw,38px);
  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

  transition:
    transform .12s,
    background .2s,
    color .7s,
    border-color .7s;
}

.choice:hover{
  transform:scale(1.025);

  background:
    rgba(
      var(--fg),
      var(--fg),
      var(--fg),
      .17
    );
}

.choice:active{
  transform:scale(.92);
}

.choice.correct{
  background:#16cf68 !important;
  border-color:#16cf68 !important;
  color:white !important;

  transform:scale(1.05);
}

.choice.wrong{
  background:#ff4057 !important;
  border-color:#ff4057 !important;
  color:white !important;

  animation:shake .25s ease;
}

@keyframes shake{
  25%{transform:translateX(-8px);}
  50%{transform:translateX(8px);}
  75%{transform:translateX(-5px);}
}

/* =========================
COUNTDOWN
========================= */

#countdown{
  position:fixed;
  inset:0;

  z-index:60;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.82);

  color:white;

  font-size:clamp(100px,25vw,240px);
  font-weight:900;
}

.countPop{
  animation:countPop .8s ease;
}

@keyframes countPop{
  0%{
    transform:scale(.2);
    opacity:0;
  }

  50%{
    transform:scale(1.15);
    opacity:1;
  }

  100%{
    transform:scale(1);
  }
}

/* =========================
POP EFFECT
========================= */

#effects{
  position:fixed;
  inset:0;

  pointer-events:none;
  overflow:hidden;

  z-index:100;
}

.pop{
  position:absolute;

  font-size:58px;
  font-weight:900;

  animation:
    popUp .8s ease-out forwards;

  text-shadow:
    0 5px 18px
    rgba(0,0,0,.35);
}

@keyframes popUp{
  0%{
    transform:
      translate(-50%,-50%)
      scale(.15);

    opacity:0;
  }

  30%{
    transform:
      translate(-50%,-50%)
      scale(1.35);

    opacity:1;
  }

  100%{
    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(.7)
      rotate(var(--r));

    opacity:0;
  }
}

#comboEffect{
  position:fixed;

  left:50%;
  top:28%;

  transform:
    translate(-50%,-50%)
    scale(.5);

  pointer-events:none;

  z-index:90;

  font-size:34px;
  font-weight:900;

  color:#ffb300;

  opacity:0;
}

#comboEffect.show{
  animation:comboShow .55s ease-out;
}

@keyframes comboShow{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.5);
  }

  40%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.25);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

/* =========================
DANGER
========================= */

body.danger #timer{
  color:#ff4057 !important;

  animation:
    dangerPulse .45s infinite alternate;
}

@keyframes dangerPulse{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}

/* =========================
RESULT
========================= */

#resultScreen{
  position:fixed;
  inset:0;

  z-index:80;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.85);
}

.resultBox{
  width:min(650px,90vw);

  padding:30px;

  border-radius:28px;

  background:white;
  color:#111;

  text-align:center;

  box-shadow:
    0 25px 90px
    rgba(0,0,0,.5);

  animation:resultIn .45s ease;
}

@keyframes resultIn{
  from{
    transform:scale(.7);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.resultBox h2{
  margin:0 0 22px;
  font-size:42px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.resultItem{
  padding:15px;

  border-radius:15px;

  background:#f1f1f1;
}

.resultItem .label{
  color:#666;
  font-size:13px;
}

.resultItem .value{
  margin-top:3px;

  font-size:30px;
  font-weight:900;
}

#rank{
  font-size:58px !important;
  color:#ff8a00;
}

#newRank{
  min-height:25px;

  margin-top:12px;

  font-weight:900;
  color:#ff8a00;
}

#restart{
  margin-top:23px;

  padding:14px 34px;

  border:0;
  border-radius:14px;

  background:#111;
  color:white;

  font-size:17px;
  font-weight:900;

  cursor:pointer;
}

/* =========================
MOBILE
========================= */

@media(max-width:600px){

  #startScreen{
    padding-top:30px;
  }

  #topbar{
    top:7px;
    left:5px;
    right:5px;
    gap:4px;
  }

  .stat{
    padding:6px 7px;
    font-size:11px;
  }

  #timer{
    min-width:70px;
    font-size:19px;
  }

  #soundBtn{
    font-size:0;
  }

  #soundBtn::after{
    content:"🔊";
    font-size:18px;
  }

  #main{
    margin-top:50px;
  }

  #question{
    min-height:90px;
  }

  #choices{
    grid-template-columns:1fr;
    gap:9px;
  }

  .choice{
    min-height:60px;
  }

  #totalStats{
    grid-template-columns:repeat(2,1fr);
  }

  .totalStat strong{
    font-size:17px;
  }

}
</style>
</head>

<body>

<!-- HOME -->

<div id="startScreen">

  <h1>
    正負の数<br>
    60秒チャレンジ
  </h1>

  <p>
    中1数学・正負の数の加減乗除
  </p>

  <div id="pressSpace">
    SPACEキーを押してスタート
  </div>


  <div id="rankPanel">

    <div id="rankPanelTitle">
      🏆 ランク解放状況
    </div>

    <div id="rankList"></div>

    <div id="rankHint">
      各ランクの必要正解数を達成すると解放！
    </div>

  </div>


  <div id="historyPanel">

    <div id="historyTitle">
      📊 累計プレイ記録
    </div>

    <div id="totalStats">

      <div class="totalStat">
        <span>プレイ回数</span>
        <strong id="totalPlays">0回</strong>
      </div>

      <div class="totalStat">
        <span>累計正解</span>
        <strong id="totalCorrect" class="green">
          0問
        </strong>
      </div>

      <div class="totalStat">
        <span>累計ミス</span>
        <strong id="totalWrong" class="red">
          0問
        </strong>
      </div>

      <div class="totalStat">
        <span>累計正答率</span>
        <strong id="totalAccuracy">
          0%
        </strong>
      </div>

      <div class="totalStat">
        <span>最高正解数</span>
        <strong id="bestCorrect">
          0問
        </strong>
      </div>

      <div class="totalStat">
        <span>最高コンボ</span>
        <strong id="bestCombo">
          0 COMBO
        </strong>
      </div>

    </div>

  </div>

</div>


<!-- GAME -->

<div id="game">

  <div id="topbar">

    <div class="stat">
      正解
      <span id="correctCount">0</span>
    </div>

    <div class="stat" id="comboBox">
      COMBO
      <span id="combo">0</span>
    </div>

    <div class="stat" id="timer">
      60.0
    </div>

    <div class="stat">
      ミス
      <span id="wrongCount">0</span>
    </div>

    <div class="stat" id="soundBtn">
      🔊 効果音 ON
    </div>

  </div>


  <main id="main">

    <div id="title">
      正負の数 60秒チャレンジ
    </div>

    <div id="subtitle">
      答えを選んで、できるだけ正解しよう！
    </div>

    <div id="question">
      準備中
    </div>

    <div id="choices">

      <button class="choice"></button>
      <button class="choice"></button>
      <button class="choice"></button>
      <button class="choice"></button>

    </div>

  </main>

</div>


<!-- COUNTDOWN -->

<div id="countdown"></div>


<!-- EFFECTS -->

<div id="effects"></div>

<div id="comboEffect"></div>


<!-- RESULT -->

<div id="resultScreen">

  <div class="resultBox">

    <h2>
      TIME UP!
    </h2>

    <div class="resultGrid">

      <div class="resultItem">
        <div class="label">正解数</div>
        <div class="value" id="finalCorrect">
          0
        </div>
      </div>

      <div class="resultItem">
        <div class="label">ミス</div>
        <div class="value" id="finalWrong">
          0
        </div>
      </div>

      <div class="resultItem">
        <div class="label">正答率</div>
        <div class="value" id="finalAccuracy">
          0%
        </div>
      </div>

      <div class="resultItem">
        <div class="label">最大コンボ</div>
        <div class="value" id="finalMaxCombo">
          0
        </div>
      </div>

      <div class="resultItem"
           style="grid-column:1/-1;">

        <div class="label">
          今回のランク
        </div>

        <div class="value" id="rank">
          ---
        </div>

      </div>

    </div>

    <div id="newRank"></div>

    <button id="restart">
      ホームへ戻る
    </button>

  </div>

</div>


<script>

/* =========================
SETTINGS
========================= */

const GAME_TIME=60;


/* =========================
RANK
========================= */

const RANKS=[

  {name:"E",score:1},
  {name:"D",score:4},
  {name:"C",score:8},
  {name:"B",score:12},
  {name:"A",score:16},
  {name:"A＋",score:20},
  {name:"S",score:25},
  {name:"S＋",score:30},
  {name:"SS",score:34},
  {name:"SS＋",score:38},
  {name:"SSS",score:42},
  {name:"SSS＋",score:46},
  {name:"Z",score:50}

];


const RANK_STORAGE_KEY=
  "mathChallengeUnlockedRanks";


const TOTAL_STORAGE_KEY=
  "mathChallengeTotalStats";


/* =========================
ELEMENT
========================= */

const startScreen=
  document.getElementById(
    "startScreen"
  );

const countdown=
  document.getElementById(
    "countdown"
  );

const resultScreen=
  document.getElementById(
    "resultScreen"
  );

const question=
  document.getElementById(
    "question"
  );

const choices=[
  ...document.querySelectorAll(
    ".choice"
  )
];

const timer=
  document.getElementById(
    "timer"
  );

const correctCount=
  document.getElementById(
    "correctCount"
  );

const wrongCount=
  document.getElementById(
    "wrongCount"
  );

const comboElement=
  document.getElementById(
    "combo"
  );

const soundBtn=
  document.getElementById(
    "soundBtn"
  );

const effects=
  document.getElementById(
    "effects"
  );

const comboEffect=
  document.getElementById(
    "comboEffect"
  );


/* =========================
STATE
========================= */

let correct=0;
let wrong=0;
let total=0;

let combo=0;
let maxCombo=0;

let timeLeft=60;

let currentAnswer=null;

let gameRunning=false;
let acceptingAnswer=false;

let timerInterval=null;

let soundOn=true;

let audioContext=null;


/* =========================
TOTAL DATA
========================= */

function getTotalStats(){

  try{

    return JSON.parse(
      localStorage.getItem(
        TOTAL_STORAGE_KEY
      )
    ) || {

      plays:0,
      correct:0,
      wrong:0,
      bestCorrect:0,
      bestCombo:0

    };

  }catch{

    return {

      plays:0,
      correct:0,
      wrong:0,
      bestCorrect:0,
      bestCombo:0

    };

  }

}


let totalStats=
  getTotalStats();


function saveTotalStats(){

  localStorage.setItem(
    TOTAL_STORAGE_KEY,
    JSON.stringify(
      totalStats
    )
  );

}


function addTotalStats(){

  totalStats.plays++;

  totalStats.correct+=correct;

  totalStats.wrong+=wrong;

  totalStats.bestCorrect=
    Math.max(
      totalStats.bestCorrect,
      correct
    );

  totalStats.bestCombo=
    Math.max(
      totalStats.bestCombo,
      maxCombo
    );

  saveTotalStats();

  updateTotalStats();

}


function updateTotalStats(){

  const totalQuestions=
    totalStats.correct+
    totalStats.wrong;


  const accuracy=
    totalQuestions===0
    ? 0
    : Math.round(
        totalStats.correct/
        totalQuestions*
        100
      );


  document.getElementById(
    "totalPlays"
  ).textContent=
    `${totalStats.plays}回`;


  document.getElementById(
    "totalCorrect"
  ).textContent=
    `${totalStats.correct}問`;


  document.getElementById(
    "totalWrong"
  ).textContent=
    `${totalStats.wrong}問`;


  document.getElementById(
    "totalAccuracy"
  ).textContent=
    `${accuracy}%`;


  document.getElementById(
    "bestCorrect"
  ).textContent=
    `${totalStats.bestCorrect}問`;


  document.getElementById(
    "bestCombo"
  ).textContent=
    `${totalStats.bestCombo} COMBO`;

}


/* =========================
RANK DATA
========================= */

function getUnlockedRanks(){

  try{

    return JSON.parse(
      localStorage.getItem(
        RANK_STORAGE_KEY
      )
    ) || [];

  }catch{

    return [];

  }

}


function saveUnlockedRanks(
  ranks
){

  localStorage.setItem(
    RANK_STORAGE_KEY,
    JSON.stringify(
      ranks
    )
  );

}


function updateRankPanel(){

  const list=
    document.getElementById(
      "rankList"
    );

  const unlocked=
    getUnlockedRanks();


  list.innerHTML="";


  RANKS.forEach(
    rank=>{

      const badge=
        document.createElement(
          "div"
        );

      const isUnlocked=
        unlocked.includes(
          rank.name
        );


      badge.className=
        "rankBadge "+
        (
          isUnlocked
          ?"unlocked"
          :"locked"
        );


      badge.innerHTML=`

        <div class="rankName">
          ${rank.name}
        </div>

        <div class="rankScore">
          ${rank.score}問
        </div>

      `;


      list.appendChild(
        badge
      );

    }
  );

}


function checkRankUnlock(
  score
){

  const unlocked=
    getUnlockedRanks();


  const rank=
    RANKS.find(
      r=>r.score===score
    );


  if(
    rank &&
    !unlocked.includes(
      rank.name
    )
  ){

    unlocked.push(
      rank.name
    );

    saveUnlockedRanks(
      unlocked
    );

    return rank.name;

  }


  return null;

}


/* =========================
AUDIO
========================= */

function initAudio(){

  if(!audioContext){

    audioContext=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state===
    "suspended"
  ){

    audioContext.resume();

  }

}


function beep(
  frequency,
  duration,
  type="sine",
  volume=.08
){

  if(!soundOn)return;

  initAudio();


  const osc=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();


  osc.type=type;

  osc.frequency.value=
    frequency;


  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+
    duration
  );


  osc.connect(gain);

  gain.connect(
    audioContext.destination
  );


  osc.start();

  osc.stop(
    audioContext.currentTime+
    duration
  );

}


function correctSound(){

  beep(523,.08);

  setTimeout(
    ()=>beep(784,.13),
    70
  );

}


function wrongSound(){

  beep(
    150,
    .18,
    "sawtooth",
    .08
  );

}


function finishSound(){

  beep(523,.1);

  setTimeout(
    ()=>beep(659,.1),
    100
  );

  setTimeout(
    ()=>beep(784,.2),
    200
  );

}


soundBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    soundOn=!soundOn;

    soundBtn.textContent=
      soundOn
      ?"🔊 効果音 ON"
      :"🔇 効果音 OFF";

  }
);


/* =========================
RANDOM
========================= */

function randomInt(
  min,
  max
){

  return Math.floor(
    Math.random()*
    (max-min+1)
  )+min;

}


function fmt(n){

  return n<0
    ?`(${n})`
    :String(n);

}


/* =========================
QUESTION
========================= */

function generateQuestion(){

  if(!gameRunning)return;


  let threeRate=0;


  /*
    残り15秒から
    3項計算が徐々に増える
  */

  if(timeLeft<=15){

    const progress=
      (15-timeLeft)/15;

    threeRate=
      .2+
      progress*.55;

  }


  if(
    Math.random()<threeRate
  ){

    generateThree();

  }else{

    generateNormal();

  }

}


function generateNormal(){

  const operations=[
    "+","-","×","÷"
  ];


  const op=
    operations[
      randomInt(
        0,
        operations.length-1
      )
    ];


  const difficulty=
    1-
    timeLeft/GAME_TIME;


  let a,b,answer;


  if(
    op==="+"||
    op==="-"
  ){

    const range=
      Math.floor(
        15+
        difficulty*12
      );


    a=randomInt(
      -range,
      range
    );

    b=randomInt(
      -range,
      range
    );


    answer=
      op==="+"
      ?a+b
      :a-b;

  }


  else if(op==="×"){

    const range=
      Math.floor(
        7+
        difficulty*4
      );


    a=randomInt(
      -range,
      range
    );

    b=randomInt(
      -range,
      range
    );


    answer=a*b;

  }


  else{

    const range=
      Math.floor(
        7+
        difficulty*4
      );


    b=randomInt(
      -range,
      range
    );


    while(b===0){

      b=randomInt(
        -range,
        range
      );

    }


    answer=randomInt(
      -12,
      12
    );


    a=b*answer;

  }


  currentAnswer=answer;


  showQuestion(
    `${fmt(a)} ${op} ${fmt(b)} = ?`,
    answer
  );

}


function generateThree(){

  const type=
    randomInt(
      1,
      4
    );


  let a,b,c,answer,text;


  if(type===1){

    a=randomInt(-15,15);
    b=randomInt(-12,12);
    c=randomInt(-12,12);

    answer=a+b-c;

    text=
      `${fmt(a)} + ${fmt(b)} - ${fmt(c)} = ?`;

  }


  else if(type===2){

    a=randomInt(-7,7);
    b=randomInt(-7,7);
    c=randomInt(-12,12);

    answer=a*b+c;

    text=
      `${fmt(a)} × ${fmt(b)} + ${fmt(c)} = ?`;

  }


  else if(type===3){

    b=randomInt(-8,8);

    while(b===0){

      b=randomInt(-8,8);

    }


    const q=
      randomInt(-10,10);

    a=b*q;

    c=randomInt(-12,12);

    answer=a/b-c;

    text=
      `${fmt(a)} ÷ ${fmt(b)} - ${fmt(c)} = ?`;

  }


  else{

    a=randomInt(-7,7);
    b=randomInt(-7,7);
    c=randomInt(-12,12);

    answer=a*b-c;

    text=
      `${fmt(a)} × ${fmt(b)} - ${fmt(c)} = ?`;

  }


  currentAnswer=answer;


  showQuestion(
    text,
    answer
  );

}


function showQuestion(
  text,
  answer
){

  question.classList.remove(
    "questionPop"
  );

  void question.offsetWidth;

  question.classList.add(
    "questionPop"
  );


  question.textContent=text;


  createChoices(answer);

}


function createChoices(
  answer
){

  const values=
    new Set([
      answer
    ]);


  while(values.size<4){

    let offset;

    do{

      offset=
        randomInt(
          -10,
          10
        );

    }while(offset===0);


    values.add(
      answer+offset
    );

  }


  const arr=
    [...values];


  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      arr[i],
      arr[j]
    ]=[
      arr[j],
      arr[i]
    ];

  }


  choices.forEach(
    (button,i)=>{

      button.textContent=
        arr[i];

      button.dataset.answer=
        arr[i];

      button.disabled=false;

      button.classList.remove(
        "correct",
        "wrong"
      );

    }
  );


  acceptingAnswer=true;

}


/* =========================
ANSWER
========================= */

function answerQuestion(
  button
){

  if(!gameRunning)return;

  if(!acceptingAnswer)return;


  acceptingAnswer=false;


  const selected=
    Number(
      button.dataset.answer
    );


  const answer=
    Number(
      currentAnswer
    );


  choices.forEach(
    b=>b.disabled=true
  );


  total++;


  if(
    selected===answer
  ){

    correct++;

    combo++;

    maxCombo=
      Math.max(
        maxCombo,
        combo
      );


    button.classList.add(
      "correct"
    );


    correctSound();

    createPop(
      "GOOD!",
      "#15ce68"
    );


    if(combo>=2){

      showCombo();

    }

  }


  else{

    wrong++;

    combo=0;

    button.classList.add(
      "wrong"
    );


    choices.forEach(
      b=>{

        if(
          Number(
            b.dataset.answer
          )===answer
        ){

          b.classList.add(
            "correct"
          );

        }

      }
    );


    wrongSound();

    createPop(
      "MISS!",
      "#ff4057"
    );

  }


  updateStats();

  updateTheme();


  setTimeout(
    ()=>{

      if(gameRunning){

        generateQuestion();

      }

    },
    350
  );

}


/* =========================
TAP
========================= */

choices.forEach(
  button=>{

    button.addEventListener(
      "pointerdown",
      e=>{

        e.preventDefault();

        answerQuestion(
          button
        );

      }
    );

  }
);


/* =========================
KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="Space" &&
      !gameRunning &&
      startScreen.style.display!=="none"
    ){

      e.preventDefault();

      startGame();

      return;

    }


    if(
      gameRunning &&
      ["1","2","3","4"]
      .includes(e.key)
    ){

      e.preventDefault();

      answerQuestion(
        choices[
          Number(e.key)-1
        ]
      );

    }

  }
);


/* =========================
STATS
========================= */

function updateStats(){

  correctCount.textContent=
    correct;

  wrongCount.textContent=
    wrong;

  comboElement.textContent=
    combo;

}


/* =========================
BACKGROUND
========================= */

function updateTheme(){

  const progress=
    Math.min(
      correct/50,
      1
    );


  const smooth=
    progress*
    progress*
    (3-2*progress);


  const bg=
    Math.round(
      5+
      smooth*250
    );


  /*
    背景と文字の
    コントラストを維持
  */

  const fg=
    bg<125
    ?255
    :15;


  document.body.style.setProperty(
    "--bg",
    bg
  );

  document.body.style.setProperty(
    "--fg",
    fg
  );

}


/* =========================
POP
========================= */

function createPop(
  text,
  color
){

  const el=
    document.createElement(
      "div"
    );


  el.className="pop";

  el.textContent=text;

  el.style.color=color;

  el.style.left=
    `${randomInt(30,70)}%`;

  el.style.top=
    `${randomInt(35,65)}%`;

  el.style.setProperty(
    "--x",
    `${randomInt(-180,180)}px`
  );

  el.style.setProperty(
    "--y",
    `${randomInt(-180,-60)}px`
  );

  el.style.setProperty(
    "--r",
    `${randomInt(-30,30)}deg`
  );


  effects.appendChild(el);


  setTimeout(
    ()=>el.remove(),
    850
  );

}


function showCombo(){

  comboEffect.textContent=
    `${combo} COMBO!`;


  comboEffect.classList.remove(
    "show"
  );


  void comboEffect.offsetWidth;


  comboEffect.classList.add(
    "show"
  );


  beep(
    Math.min(
      500+combo*25,
      1000
    ),
    .08,
    "triangle",
    .06
  );

}


/* =========================
TIMER
========================= */

function updateTimer(){

  timer.textContent=
    timeLeft.toFixed(1);


  if(
    timeLeft<=10 &&
    timeLeft>0
  ){

    document.body.classList.add(
      "danger"
    );

  }else{

    document.body.classList.remove(
      "danger"
    );

  }

}


function startTimer(){

  timeLeft=GAME_TIME;

  updateTimer();


  timerInterval=
    setInterval(
      ()=>{

        timeLeft-=.1;


        if(timeLeft<=0){

          timeLeft=0;

          updateTimer();

          endGame();

          return;

        }


        updateTimer();

      },
      100
    );

}


/* =========================
START
========================= */

function startGame(){

  if(gameRunning)return;


  initAudio();


  correct=0;
  wrong=0;
  total=0;

  combo=0;
  maxCombo=0;


  updateStats();


  document.body.style.setProperty(
    "--bg",
    5
  );

  document.body.style.setProperty(
    "--fg",
    255
  );


  resultScreen.style.display=
    "none";

  startScreen.style.display=
    "none";


  countdown.style.display=
    "flex";


  let count=3;


  countdown.textContent=
    count;

  countdown.classList.add(
    "countPop"
  );


  beep(
    500,
    .08,
    "square",
    .05
  );


  const interval=
    setInterval(
      ()=>{

        count--;


        countdown.classList.remove(
          "countPop"
        );

        void countdown.offsetWidth;

        countdown.classList.add(
          "countPop"
        );


        if(count>0){

          countdown.textContent=
            count;

          beep(
            500,
            .08,
            "square",
            .05
          );

        }else{

          countdown.textContent=
            "START!";


          beep(
            880,
            .18,
            "square",
            .08
          );


          setTimeout(
            ()=>{

              countdown.style.display=
                "none";


              countdown.classList.remove(
                "countPop"
              );


              gameRunning=true;

              generateQuestion();

              startTimer();

            },
            600
          );


          clearInterval(
            interval
          );

        }

      },
      900
    );

}


/* =========================
END
========================= */

function endGame(){

  if(!gameRunning)return;


  gameRunning=false;

  acceptingAnswer=false;


  clearInterval(
    timerInterval
  );


  choices.forEach(
    button=>{
      button.disabled=true;
    }
  );


  finishSound();


  /*
    今回の結果を
    累計に追加
  */

  addTotalStats();


  showResult();

}


/* =========================
RESULT
========================= */

function showResult(){

  const newlyUnlocked=
    checkRankUnlock(
      correct
    );


  const accuracy=
    total===0
    ?0
    :Math.round(
      correct/total*100
    );


  let currentRank="---";


  RANKS.forEach(
    rank=>{

      if(
        correct>=rank.score
      ){

        currentRank=
          rank.name;

      }

    }
  );


  document.getElementById(
    "finalCorrect"
  ).textContent=
    correct;


  document.getElementById(
    "finalWrong"
  ).textContent=
    wrong;


  document.getElementById(
    "finalAccuracy"
  ).textContent=
    `${accuracy}%`;


  document.getElementById(
    "finalMaxCombo"
  ).textContent=
    maxCombo;


  document.getElementById(
    "rank"
  ).textContent=
    currentRank;


  document.getElementById(
    "newRank"
  ).textContent=
    newlyUnlocked
    ?`🎉 ${newlyUnlocked} ランク解放！`
    :"";


  updateRankPanel();


  resultScreen.style.display=
    "flex";

}


/* =========================
RESET
========================= */

function resetToStart(){

  clearInterval(
    timerInterval
  );


  gameRunning=false;

  acceptingAnswer=false;


  resultScreen.style.display=
    "none";

  startScreen.style.display=
    "flex";


  question.textContent=
    "準備中";


  choices.forEach(
    button=>{

      button.textContent="";

      button.disabled=true;

      button.classList.remove(
        "correct",
        "wrong"
      );

    }
  );


  timer.textContent=
    "60.0";


  document.body.classList.remove(
    "danger"
  );


  document.body.style.setProperty(
    "--bg",
    5
  );

  document.body.style.setProperty(
    "--fg",
    255
  );


  updateRankPanel();

  updateTotalStats();

}


/* =========================
RESTART
========================= */

document.getElementById(
  "restart"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    resetToStart();

  }
);


/* =========================
INIT
========================= */

resetToStart();

</script>
